name: Terraform Plan
on:
  pull_request:
    branches:
      - main

jobs:
  terraform-plan:
    environment: dev
    permissions:
      contents: read
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: (update this)
          tenant-id: (update this)
          subscription-id: (update this)

      - name: Terraform Init
        shell: bash
        env:
          ARM_USE_AZUREAD: "true"
        run: |
          terraform init \
            -backend-config="resource_group_name=tfstate-rg" \
            -backend-config="storage_account_name=(update this)" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate"

      - name: Terraform Plan
        shell: bash
        env:
          ARM_USE_AZUREAD: "true"
        run: |
          terraform plan -out=tfplan