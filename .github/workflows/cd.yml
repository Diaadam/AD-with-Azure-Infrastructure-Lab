name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish and promote
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: echo "Build service image with tag ${{ inputs.image_tag }}"
      - name: Push image
        run: echo "Push image to the configured registry"
      - name: Bump GitOps tag
        run: echo "Update the GitOps repository to ${{ inputs.image_tag }}"
