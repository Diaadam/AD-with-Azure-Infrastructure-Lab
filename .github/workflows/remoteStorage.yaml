name: create a remote storage on azure to store the tfstate using iac/terraform/bootstrap
on:
  workflow_dispatch:
      inputs:
          target:
              type: environment
              default: dev
permissions:
  id-token: write
  contents: read
env:
  TF_VAR_repository_name: ${{github.repository}}
  TF_VAR_entity_type: environment
  TF_VAR_environment_names: ${{ inputs.target }}

jobs:
  tfsec:
    name: tfsec (code scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Run tfsec
    
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: iac/terraform/bootstrap
          additional_args: >
            --concise-output
            --format sarif
            --out tfsec.sarif
            --soft-fail-severities LOW, MEDIUM

      - name: Upload SARIF (tfsec)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif
############################################################
  checkov:
    name: Checkov (plan scan)
    runs-on: ubuntu-latest
    needs: tfsec
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        working-directory: iac/terraform/bootstrap
        run: terraform init 

      - name: Terraform Plan (json)
        working-directory: iac/terraform/bootstrap
        run: terraform plan -out=tfplan.bin && terraform show -json tfplan.bin > tfplan.json

      - name: Run Checkov on plan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: iac/terraform/bootstrap
          file: tfplan.json
          framework: terraform_plan
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload SARIF (Checkov)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

  create-state-backend:
    needs: 
      - tfsec
      - checkov

    runs-on: ubuntu-latest
    environment: ${{inputs.target}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{vars.STORAGE_CLIENT_ID}}
          tenant-id: ${{vars.TENANT_ID}}
          subscription-id: ${{vars.SUBSCRIPTION_ID}}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform init
        working-directory: iac/terraform/bootstrap
        run: terraform init

      - name: Terraform validate
        working-directory: iac/terraform/bootstrap
        run: terraform validate

      - name: Terraform apply
        working-directory: iac/terraform/bootstrap
        run: terraform apply -auto-approve


